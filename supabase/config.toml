project_id = "bajo-techo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# El demo no tiene registro público: los usuarios los crea la tienda.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Ojo: en el CLI, auth.email.enable_signup mapea a GOTRUE_EXTERNAL_EMAIL_ENABLED,
# que apaga el LOGIN por correo, no solo el registro. Va en true.
# El registro público se cierra arriba, con [auth] enable_signup = false.
enabled = true
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[analytics]
enabled = false
